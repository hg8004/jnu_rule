<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>학사 규정 챗봇</title>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
<style>
 :root{
   --bg:#f3f4f6; --surface:#ffffff; --ink:#1b1e23; --sub:#5f6772; --line:#e1e4e8;
   --accent:#2457d6; --accent-ink:#ffffff; --user:#2457d6; --user-ink:#ffffff;
   --chip:#eaf0fd; --chip-ink:#1d47b3; --warn:#9a3d14; --warn-bg:#fff3eb; --code:#f2f3f5;
 }
 @media (prefers-color-scheme: dark){
   :root{
     --bg:#111317; --surface:#1b1e24; --ink:#e7e9ec; --sub:#9aa3ad; --line:#2c3139;
     --accent:#7b9cff; --accent-ink:#0d1117; --user:#3a5fd0; --user-ink:#ffffff;
     --chip:#1f2940; --chip-ink:#a9c0ff; --warn:#ffb48f; --warn-bg:#2a1d16; --code:#23272e;
   }
 }
 *{box-sizing:border-box}
 html,body{height:100%}
 body{margin:0;background:var(--bg);color:var(--ink);
   font:15px/1.65 -apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif}
 .app{max-width:820px;margin:0 auto;height:100dvh;display:flex;flex-direction:column;padding:0 16px}

 .top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0 10px;border-bottom:1px solid var(--line)}
 .brand{display:flex;align-items:center;gap:10px;min-width:0}
 .logo{width:36px;height:36px;border-radius:10px;background:var(--accent);color:var(--accent-ink);
   display:grid;place-items:center;font-weight:700;flex:none}
 h1{font-size:17px;margin:0;line-height:1.3}
 .sub{margin:0;color:var(--sub);font-size:12.5px}
 .icon-btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:9px;
   padding:7px 12px;font:inherit;font-size:13.5px;cursor:pointer;flex:none}
 .icon-btn[aria-expanded="true"]{border-color:var(--accent);color:var(--accent)}

 .settings{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:10px}
 .settings label.lbl{display:block;font-weight:600;font-size:13px;margin-bottom:6px}
 .settings input[type=password]{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;
   font:inherit;background:var(--bg);color:var(--ink)}
 .chk{display:flex;gap:6px;align-items:center;font-size:12.5px;color:var(--sub);margin-top:8px}
 .idxrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;
   margin-top:12px;padding-top:12px;border-top:1px dashed var(--line);font-size:13px;color:var(--sub)}
 .filebtn{border:1px solid var(--line);border-radius:8px;padding:5px 10px;cursor:pointer;color:var(--ink);font-size:12.5px}

 .log{flex:1;overflow-y:auto;padding:18px 0 8px;display:flex;flex-direction:column;gap:14px}
 .row{display:flex}
 .row.user{justify-content:flex-end}
 .bubble{max-width:88%;padding:11px 14px;border-radius:16px;word-break:break-word}
 .row.user .bubble{background:var(--user);color:var(--user-ink);border-bottom-right-radius:5px;white-space:pre-wrap}
 .row.bot .bubble{background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:5px}
 .row.bot .bubble.err{background:var(--warn-bg);color:var(--warn);border-color:transparent}

 .md > :first-child{margin-top:0} .md > :last-child{margin-bottom:0}
 .md h1,.md h2,.md h3,.md h4{font-size:15px;margin:14px 0 6px}
 .md p{margin:6px 0} .md ul,.md ol{margin:6px 0;padding-left:20px}
 .md blockquote{margin:8px 0;padding:6px 10px;border-left:3px solid var(--line);color:var(--sub)}
 .md table{display:block;overflow-x:auto;border-collapse:collapse;margin:8px 0;font-size:13.5px}
 .md th,.md td{border:1px solid var(--line);padding:5px 8px;text-align:left}
 .md code{background:var(--code);padding:1px 5px;border-radius:5px;font-size:13px}
 .md hr{border:0;border-top:1px solid var(--line);margin:10px 0}

 .warnbox{background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:9px 11px;font-size:13px;margin:10px 0}
 .chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
 .chip{border:0;background:var(--chip);color:var(--chip-ink);border-radius:999px;padding:7px 12px;
   font:inherit;font-size:13px;cursor:pointer;text-align:left}
 .chip:disabled{opacity:.5;cursor:default}

 .typing{display:flex;align-items:center;gap:10px;color:var(--sub);font-size:13.5px}
 .dots{display:inline-flex;gap:4px}
 .dots i{width:6px;height:6px;border-radius:50%;background:var(--sub);animation:blink 1.2s infinite ease-in-out}
 .dots i:nth-child(2){animation-delay:.2s} .dots i:nth-child(3){animation-delay:.4s}
 @keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
 @media (prefers-reduced-motion: reduce){.dots i{animation:none;opacity:.6}}

 details.src{margin-top:10px;border-top:1px dashed var(--line);padding-top:8px;font-size:12.5px;color:var(--sub)}
 details.src > summary{cursor:pointer}
 details.hit{margin:6px 0 0 4px}
 details.hit > summary{cursor:pointer;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px}
 details.hit pre{white-space:pre-wrap;word-break:break-word;margin:6px 0 0;padding:8px;border-radius:8px;
   background:var(--code);color:var(--ink);font:12px/1.55 ui-monospace,Menlo,Consolas,monospace;max-height:260px;overflow:auto}

 .composer{display:flex;gap:8px;align-items:flex-end;padding:10px 0 6px;border-top:1px solid var(--line)}
 .brand > div{min-width:0}
 .composer textarea{flex:1;min-width:0;resize:none;max-height:160px;padding:10px 12px;border:1px solid var(--line);
   border-radius:12px;font:inherit;background:var(--surface);color:var(--ink)}
 .composer textarea:focus,.settings input:focus{outline:2px solid var(--accent);outline-offset:-1px}
 .send{border:0;background:var(--accent);color:var(--accent-ink);border-radius:12px;padding:10px 16px;
   font:inherit;font-weight:600;cursor:pointer;flex:none}
 .send:disabled{opacity:.5;cursor:default}
 .foot{margin:0 0 10px;color:var(--sub);font-size:11.5px;text-align:center}
</style>
</head>
<body>
<div class="app">

  <header class="top">
    <div class="brand">
      <div class="logo" aria-hidden="true">규</div>
      <div>
        <h1>학사 규정 챗봇</h1>
        <p class="sub">전남대학교 학사 규정 5종 · 비공식 학생 실습물</p>
      </div>
    </div>
    <button id="gear" class="icon-btn" type="button" aria-expanded="false" aria-controls="settings">⚙ 설정</button>
  </header>

  <section id="settings" class="settings" hidden>
    <label class="lbl" for="key">TimelyGPT API 키</label>
    <input id="key" type="password" placeholder="tgpt_sk_..." autocomplete="off">
    <label class="chk"><input id="remember" type="checkbox" checked>
      이 탭을 닫을 때까지 기억 — 키는 이 브라우저에만 있고 파일이나 다른 서버에 저장되지 않습니다</label>
    <div class="idxrow">
      <span id="idxinfo">색인 확인 중…</span>
      <label class="filebtn">색인 직접 고르기<input id="idx" type="file" accept=".json" hidden></label>
    </div>
  </section>

  <main id="log" class="log" aria-live="polite"></main>

  <form id="composer" class="composer">
    <textarea id="q" rows="1" placeholder="규정에 대해 물어보세요"></textarea>
    <button id="go" class="send" type="submit">보내기</button>
  </form>
  <p class="foot">Enter 전송 · Shift+Enter 줄바꿈 · 질문마다 따로 검색해 답하며 앞의 대화는 기억하지 않습니다.</p>
</div>

<script>
// ─────────────────────────────────────────────────────────────
//  전남대학교 학사 규정 챗봇 — 실습 P7 (웹 공개판)
//  검색·프롬프트·모델은 실습에서 잰 results/chatbot.html 과 같다. 화면만 다르다.
// ─────────────────────────────────────────────────────────────
const BASE = "https://hello.timelygpt.co.kr/api/v2/chat/bridge/openai";
const EMB  = "openai/text-embedding-3-small";
const CHAT = "anthropic/claude-opus-4.7";
const K = 5;   // 답안지 16문항 실측: 근거 24개 중 21개가 1~3위, 나머지는 #11·#15·#16 — k=3~10 은 결과가 같다

let INDEX = null;   // { chunks: [{id, 문서, 조항, 판본, 본문}], vectors: [[...], ...] }
let busy = false;
const $ = id => document.getElementById(id);
const log = $("log"), keyEl = $("key"), remEl = $("remember"), qEl = $("q");

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
}

// ── 설정 패널 · 키 ───────────────────────────────────────────
function toggleSettings(open) {
  const s = $("settings");
  if (open === undefined) open = s.hidden;
  s.hidden = !open;
  $("gear").setAttribute("aria-expanded", String(open));
  if (open && !keyEl.value) keyEl.focus();
}
$("gear").addEventListener("click", () => toggleSettings());

try { const saved = sessionStorage.getItem("tgpt_key"); if (saved) keyEl.value = saved; } catch (e) {}
function saveKey() {
  try {
    if (remEl.checked && keyEl.value.trim()) sessionStorage.setItem("tgpt_key", keyEl.value.trim());
    else sessionStorage.removeItem("tgpt_key");
  } catch (e) {}
}
keyEl.addEventListener("input", saveKey);
remEl.addEventListener("change", saveKey);

// ── 색인 ─────────────────────────────────────────────────────
function setIndex(data, from) {
  INDEX = data;
  const ok = INDEX.chunks.length === INDEX.vectors.length;
  $("idxinfo").textContent = `색인: ${from} · 조각 ${INDEX.chunks.length}개 · ${ok ? "벡터 짝이 맞습니다" : "★ 벡터 개수가 다릅니다"}`;
}
$("idx").addEventListener("change", async e => {
  const f = e.target.files[0]; if (!f) return;
  try { setIndex(JSON.parse(await f.text()), "직접 고른 파일"); }
  catch (err) { $("idxinfo").textContent = "이 파일을 색인으로 읽지 못했습니다: " + err.message; }
});
if (location.protocol.startsWith("http")) {
  fetch("index_A.json")
    .then(r => { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
    .then(d => setIndex(d, "자동으로 불러옴"))
    .catch(err => { $("idxinfo").textContent = `색인을 자동으로 불러오지 못했습니다 (${err.message}). 직접 고르십시오.`; });
} else {
  $("idxinfo").textContent = "파일로 열었습니다 — 색인(index_A.json)을 직접 고르십시오.";
}

// ── API · 검색 (실습판과 같음) ───────────────────────────────
async function api(path, body) {
  const key = keyEl.value.trim();
  if (!key) throw new Error("API 키를 입력하십시오.");
  const r = await fetch(BASE + path, {
    method: "POST",
    headers: { "Authorization": "Bearer " + key, "Content-Type": "application/json" },
    body: JSON.stringify(body)
  });
  const j = await r.json();
  if (!r.ok || j.error) throw new Error(JSON.stringify(j.error || j).slice(0, 200));
  return j;
}

async function embed(text) {
  const j = await api("/embeddings", { model: EMB, input: text });
  return j.data[0].embedding;
}

function cos(a, b) {
  let d = 0, na = 0, nb = 0;
  for (let i = 0; i < a.length; i++) { d += a[i]*b[i]; na += a[i]*a[i]; nb += b[i]*b[i]; }
  return d / (Math.sqrt(na) * Math.sqrt(nb));
}

function retrieve(qvec, k) {
  return INDEX.vectors
    .map((v, i) => ({ chunk: INDEX.chunks[i], score: cos(qvec, v) }))
    .sort((a, b) => b.score - a.score)
    .slice(0, k);
}

const SYSTEM_RULES =
`너는 전남대학교 학사 규정에 대해 답하는 도우미다. 아래 [문맥]에 주어진 규정 조각만을 근거로 답한다.

반드시 지킬 것:
1. 답의 근거가 된 조각의 문서명·조항·판본을 함께 밝힌다. 예) (전남대학교 교학규정 제50조, 판본: 전남대학교학교규정 제2225호, 2026. 7. 1., 일부개정.)
2. 서로 다른 답이 나올 수 있으면 전부 제시하고, 어느 조건에서 어느 것이 적용되는지 밝힌다. 하나만 골라 단정하지 않는다.
3. 주어진 문맥으로 확인할 수 없으면 「확인할 수 없다」고 답한다. 추측하지 않는다. 문맥에 없는 내용을 일반 지식으로 메우지 않는다.`;

function formatContext(hits) {
  return hits.map((h, i) =>
    `[조각 ${i + 1}] 문서: ${h.chunk.문서} | 조항: ${h.chunk.조항} | 판본: ${h.chunk.판본}\n${h.chunk.본문.trim()}`
  ).join("\n\n---\n\n");
}

function buildMessages(question, hits) {
  return [
    { role: "system", content: SYSTEM_RULES + "\n\n[문맥]\n" + formatContext(hits) },
    { role: "user", content: question }
  ];
}

// ── 대화 화면 ────────────────────────────────────────────────
function scrollDown() { log.scrollTop = log.scrollHeight; }

function addBubble(role) {
  const row = document.createElement("div");
  row.className = "row " + role;
  const b = document.createElement("div");
  b.className = "bubble";
  row.append(b);
  log.append(row);
  scrollDown();
  return b;
}

function renderMarkdown(el, text) {
  if (window.marked && window.DOMPurify) {
    el.innerHTML = DOMPurify.sanitize(marked.parse(text));
    el.querySelectorAll("a").forEach(a => { a.target = "_blank"; a.rel = "noopener noreferrer"; });
  } else {
    el.textContent = text;
    el.style.whiteSpace = "pre-wrap";
  }
}

function sourcesBlock(hits, usage) {
  const d = document.createElement("details");
  d.className = "src";
  const tokens = usage ? ` · 토큰 입력 ${usage.prompt_tokens} · 출력 ${usage.completion_tokens}` : "";
  d.innerHTML = `<summary>검색된 조각 ${hits.length}개 보기${tokens}</summary>` +
    hits.map((h, i) =>
      `<details class="hit"><summary>${i + 1}위 · ${h.score.toFixed(3)} · ${esc(h.chunk.문서 || "")} · ${esc(h.chunk.조항 || h.chunk.id)}</summary>` +
      `<pre>${esc((h.chunk.본문 || "").slice(0, 1500))}</pre></details>`
    ).join("");
  return d;
}

function setBusy(on) {
  busy = on;
  $("go").disabled = on;
  document.querySelectorAll(".chip").forEach(c => c.disabled = on);
}

function botNotice(text) {
  const b = addBubble("bot");
  b.classList.add("err");
  b.textContent = text;
}

async function ask(raw) {
  const q = raw.trim();
  if (!q || busy) return;
  addBubble("user").textContent = q;

  if (!keyEl.value.trim()) { botNotice("API 키가 필요합니다. 위의 ⚙ 설정에 키를 넣고 다시 보내 주세요."); toggleSettings(true); return; }
  if (!INDEX) { botNotice("색인이 아직 준비되지 않았습니다. ⚙ 설정에서 색인 상태를 확인해 주세요."); toggleSettings(true); return; }

  setBusy(true);
  const b = addBubble("bot");
  b.innerHTML = `<div class="typing"><span class="dots"><i></i><i></i><i></i></span><span class="st">질문을 벡터로 바꾸는 중…</span></div>`;
  const st = b.querySelector(".st");
  try {
    const qv = await embed(q);
    st.textContent = "규정을 검색하는 중…";
    const hits = retrieve(qv, K);
    st.textContent = "답을 쓰는 중…";
    const j = await api("/chat/completions", { model: CHAT, messages: buildMessages(q, hits), max_tokens: 1200 });
    const ans = j.choices[0].message.content;
    b.innerHTML = "";
    const body = document.createElement("div");
    body.className = "md";
    renderMarkdown(body, ans);
    b.append(body, sourcesBlock(hits, j.usage));
  } catch (e) {
    b.innerHTML = "";
    b.classList.add("err");
    b.textContent = "오류: " + e.message;
  } finally {
    setBusy(false);
    scrollDown();
    qEl.focus();
  }
}

// ── 첫 인사 · 예시 질문 ──────────────────────────────────────
(function welcome() {
  const b = addBubble("bot");
  b.innerHTML = `
    <div class="md">
      <p>안녕하세요. <b>전남대학교 학사 규정</b>(교학규정 · 졸업(수료)사정 지침 · 연도별 확인사항 · 복수전공 규정 · 계절학기 규정)을
      검색해서, 찾은 조항을 근거로 답합니다.</p>
    </div>
    <div class="warnbox">
      전남대학교의 공식 서비스가 아닌 <b>학생 실습물</b>입니다. 답으로 학사 판단을 하지 마시고 근거 조항을 직접 확인하십시오.
      근거가 여러 조항에 흩어진 질문에서는 일부 조항을 놓칠 수 있고, 학칙은 들어 있지 않습니다.
    </div>
    <div class="chips"></div>`;
  const examples = [
    "한 계절학기에 몇 학점까지 신청할 수 있습니까?",
    "졸업하려면 전 학년 평균평점이 얼마 이상이어야 합니까?",
    "복수전공 이수를 지원하려면 몇 학점 이상 취득해야 합니까?",
    "수강취소는 언제까지 할 수 있습니까?"
  ];
  const chips = b.querySelector(".chips");
  examples.forEach(text => {
    const c = document.createElement("button");
    c.type = "button";
    c.className = "chip";
    c.textContent = text;
    c.addEventListener("click", () => ask(text));
    chips.append(c);
  });
  if (!keyEl.value) toggleSettings(true);
})();

// ── 입력창 ───────────────────────────────────────────────────
function autoGrow() { qEl.style.height = "auto"; qEl.style.height = Math.min(qEl.scrollHeight, 160) + "px"; }
qEl.addEventListener("input", autoGrow);
qEl.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); $("composer").requestSubmit(); }
});
$("composer").addEventListener("submit", e => {
  e.preventDefault();
  const text = qEl.value;
  if (!text.trim() || busy) return;
  qEl.value = ""; autoGrow();
  ask(text);
});
</script>
</body>
</html>
